<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MaSaison — l'appli du foot d'animation</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F4F6F1; --surface:#FFFFFF; --surface-2:#F8FAF6; --ink:#15231A; --ink-soft:#5B6A60; --line:#DDE4DC;
    --gazon:#1F6E44; --gazon-deep:#123F28; --gazon-tint:#E2F0E7;
    --parquet:#2D5CA6; --parquet-tint:#E3EBF7;
    --chasuble:#F2711C; --chasuble-tint:#FDEBDD; --chasuble-ink:#9A4205;
    --or:#E9A610; --or-light:#FFD65C; --or-ink:#4A3200;
    --alert:#C2302C; --alert-tint:#F8E3E1;
    --display:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
    --body:'Nunito Sans','Segoe UI',system-ui,-apple-system,sans-serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0F1712; --surface:#17221B; --surface-2:#1C2A21; --ink:#E8EFE9; --ink-soft:#9DAEA3; --line:#2A3A2F;
      --gazon:#3C9A66; --gazon-deep:#0B2718; --gazon-tint:#1D3527; --parquet:#6F9BE0; --parquet-tint:#1E2C44;
      --chasuble:#FF8A3D; --chasuble-tint:#3A2616; --chasuble-ink:#FFB27F; --alert:#F0716C; --alert-tint:#3A1C1B;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0F1712; --surface:#17221B; --surface-2:#1C2A21; --ink:#E8EFE9; --ink-soft:#9DAEA3; --line:#2A3A2F;
    --gazon:#3C9A66; --gazon-deep:#0B2718; --gazon-tint:#1D3527; --parquet:#6F9BE0; --parquet-tint:#1E2C44;
    --chasuble:#FF8A3D; --chasuble-tint:#3A2616; --chasuble-ink:#FFB27F; --alert:#F0716C; --alert-tint:#3A1C1B;
  }
  * { box-sizing:border-box; }
  html { scroll-padding-top:env(safe-area-inset-top,0px); }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.45; }
  button { font-family:var(--body); color:inherit; }
  img { max-width:100%; display:block; }
  button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible { outline:3px solid var(--chasuble); outline-offset:2px; }

  header { position:relative; overflow:hidden; color:#fff; padding:1.3rem 1.2rem 1.5rem;
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0 44px,transparent 44px 88px),var(--gazon-deep); }
  header svg.chalk { position:absolute; right:-60px; top:50%; transform:translateY(-50%); width:230px; height:230px; opacity:.22; }
  .header-inner { max-width:760px; margin:0 auto; position:relative; }
  .brand { font-family:var(--display); font-weight:800; font-size:2.3rem; line-height:.95; margin:0; }
  .brand span { color:var(--chasuble); }
  .header-sub { margin:.35rem 0 0; font-size:.85rem; color:rgba(255,255,255,.75); }
  main { max-width:760px; margin:0 auto; padding:1.2rem 1rem calc(6rem + env(safe-area-inset-bottom,0px)); }

  nav.tabbar { position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--surface); border-top:1px solid var(--line);
    padding:.4rem .6rem calc(.4rem + env(safe-area-inset-bottom,0px)); display:flex; justify-content:center; }
  .tabbar-inner { display:flex; gap:.3rem; width:100%; max-width:520px; }
  .tab { flex:1; border:none; background:transparent; border-radius:12px; padding:.45rem .3rem; display:flex; flex-direction:column; align-items:center; gap:.15rem; cursor:pointer; font-size:.74rem; font-weight:700; color:var(--ink-soft); }
  .tab svg { width:22px; height:22px; }
  .tab.active { background:var(--gazon-tint); color:var(--gazon); }

  h2.section { font-family:var(--display); font-weight:700; font-size:1.45rem; line-height:1.1; margin:1.7rem 0 .7rem; }
  h2.section:first-child { margin-top:.3rem; }
  h3.sub { font-family:var(--display); font-weight:700; font-size:1.1rem; margin:1rem 0 .5rem; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:1rem; margin-bottom:.9rem; }
  .label { display:block; font-size:.8rem; font-weight:700; color:var(--ink-soft); margin-bottom:.35rem; }
  .hint { font-size:.8rem; color:var(--ink-soft); margin:.5rem 0 0; }
  input[type="text"],input[type="date"],input[type="time"],select,textarea { width:100%; border:1px solid var(--line); border-radius:10px; padding:.6rem .75rem; background:var(--surface-2); color:var(--ink); font-family:var(--body); font-size:.95rem; }
  textarea { resize:vertical; min-height:4.6rem; }
  textarea.tall { min-height:11rem; }
  .row { display:flex; gap:.6rem; } .row > * { flex:1; min-width:0; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:.6rem; margin-bottom:.7rem; }

  .btn { display:inline-flex; justify-content:center; align-items:center; gap:.4rem; border:none; border-radius:12px; padding:.75rem 1rem; font-weight:800; font-size:.92rem; cursor:pointer; background:var(--gazon); color:#fff; }
  .btn.block { width:100%; margin-top:.7rem; }
  .btn.ghost { background:var(--surface); color:var(--ink); border:1px solid var(--line); }
  .btn.small { padding:.5rem .8rem; font-size:.82rem; }
  .btn.orange { background:var(--chasuble); }
  .link-btn { background:none; border:none; padding:0; font-size:.82rem; color:var(--ink-soft); text-decoration:underline; cursor:pointer; }

  .tag { display:inline-block; font-size:.72rem; font-weight:800; border-radius:6px; padding:.12rem .45rem; vertical-align:middle; }
  .tag.foot { background:var(--gazon-tint); color:var(--gazon); }
  .tag.futsal { background:var(--parquet-tint); color:var(--parquet); }
  .tag.new { background:var(--chasuble); color:#fff; }
  .tag.club { background:var(--gazon-deep); color:#fff; }

  .pick-list { display:grid; gap:.5rem; }
  .pick { display:flex; align-items:center; gap:.75rem; text-align:left; cursor:pointer; border:1.5px solid var(--line); background:var(--surface); border-radius:14px; padding:.7rem .85rem; }
  .pick.active { border-color:var(--gazon); background:var(--gazon-tint); }
  .avatar { width:38px; height:38px; border-radius:50%; flex-shrink:0; display:grid; place-items:center; background:var(--gazon-deep); color:#fff; font-family:var(--display); font-weight:800; font-size:1.05rem; }
  .pick-name { font-weight:800; display:block; }
  .pick-sub { font-size:.8rem; color:var(--ink-soft); }

  .segment { display:flex; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:4px; margin:.9rem 0 .2rem; }
  .segment button { flex:1; border:none; background:transparent; border-radius:9px; padding:.55rem .4rem; font-weight:800; font-size:.85rem; cursor:pointer; color:var(--ink-soft); }
  .segment button.active { background:var(--gazon-deep); color:#fff; }
  .segment.big button { padding:.75rem .4rem; font-size:.95rem; }
  .segment.big button.active.match { background:var(--chasuble); }

  .alert { display:flex; gap:.6rem; align-items:flex-start; border-radius:12px; padding:.7rem .85rem; font-size:.86rem; margin:.6rem 0; background:var(--alert-tint); color:var(--alert); font-weight:600; }
  .alert svg { flex-shrink:0; width:18px; height:18px; margin-top:1px; }

  .scoreboard { background:var(--gazon-deep); color:#fff; border-radius:16px; padding:1rem 1rem .9rem; margin-bottom:.9rem; background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 36px,transparent 36px 72px); }
  .scoreboard-title { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:.7rem; }
  .scoreboard-title strong { font-family:var(--display); font-size:1.25rem; font-weight:700; }
  .scoreboard-title span { font-size:.78rem; color:rgba(255,255,255,.7); }
  .scores { display:grid; grid-template-columns:repeat(auto-fit,minmax(92px,1fr)); gap:.5rem; }
  .score { background:rgba(255,255,255,.08); border-radius:10px; padding:.55rem .6rem; }
  .score b { display:block; font-family:var(--display); font-weight:800; font-size:2rem; line-height:1; font-variant-numeric:tabular-nums; }
  .score small { font-size:.72rem; color:rgba(255,255,255,.75); }
  .score.gold b { color:var(--or-light); }
  .trend { font-family:var(--body); font-size:.72rem; font-weight:800; margin-left:.25rem; }
  .trend.up { color:#8BE3AE; } .trend.down { color:#FFA8A4; }

  .objective { border-left:5px solid var(--chasuble); }
  .objective p { margin:0; font-weight:600; }

  .players { display:grid; gap:.6rem; }
  .player { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:.75rem .8rem; }
  .player.absent { opacity:.72; }
  .player.is-mvp { border-color:var(--or); box-shadow:0 0 0 2px var(--or-light) inset; }
  .player-top { display:flex; align-items:center; gap:.65rem; }
  .jersey { width:36px; height:36px; border-radius:10px; display:grid; place-items:center; flex-shrink:0; font-family:var(--display); font-weight:800; font-size:1rem; color:#fff; background:var(--gazon); }
  .jersey.futsal { background:var(--parquet); }
  .player-name { flex:1; font-weight:800; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--alert); display:inline-block; margin-left:.3rem; vertical-align:middle; }
  .presence { border:1.5px solid var(--line); background:var(--surface-2); border-radius:999px; padding:.38rem .8rem; font-weight:800; font-size:.8rem; cursor:pointer; min-width:88px; color:var(--ink-soft); }
  .presence.on { border-color:var(--gazon); background:var(--gazon); color:#fff; }
  .badges { display:flex; flex-wrap:wrap; gap:.35rem; margin-top:.6rem; }
  .badge { border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); border-radius:8px; padding:.3rem .55rem; font-size:.74rem; font-weight:700; cursor:pointer; }
  .badge.on { background:var(--chasuble-tint); border-color:var(--chasuble); color:var(--chasuble-ink); }
  .badge.static { cursor:default; }
  .badge.mvp { border:1.5px solid var(--or); color:var(--or-ink); background:#FFF6DC; font-weight:800; }
  .badge.mvp.on { background:linear-gradient(135deg,var(--or-light),var(--or)); border-color:var(--or); color:var(--or-ink); box-shadow:0 2px 8px rgba(233,166,16,.45); }
  .badge.dim { opacity:.45; }
  .player-tools { display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.6rem; }
  .tool { border:1px dashed var(--line); background:transparent; border-radius:8px; padding:.3rem .6rem; font-size:.75rem; font-weight:700; color:var(--ink-soft); cursor:pointer; }
  .tool.on { border-style:solid; border-color:var(--alert); color:var(--alert); }
  .tool.open { border-style:solid; border-color:var(--gazon); color:var(--gazon); }
  .tool.open.parent { border-color:var(--chasuble); color:var(--chasuble-ink); }
  .note-panel { margin-top:.6rem; background:var(--surface-2); border-radius:10px; padding:.7rem; }
  .note-panel.parent { background:var(--chasuble-tint); }
  .note-list { list-style:none; margin:.7rem 0 0; padding:0; display:grid; gap:.4rem; }
  .note-list li { font-size:.85rem; border-left:3px solid var(--gazon); padding-left:.55rem; }
  .note-panel.parent .note-list li { border-left-color:var(--chasuble); }
  .note-list time { display:block; font-size:.72rem; color:var(--ink-soft); font-weight:700; }

  .chips { display:flex; flex-wrap:wrap; gap:.4rem; margin-bottom:.7rem; }
  .chip { border:1.5px solid var(--line); background:var(--surface); border-radius:999px; padding:.4rem .75rem; font-size:.82rem; font-weight:700; cursor:pointer; }
  .chip.active { background:var(--gazon-deep); border-color:var(--gazon-deep); color:#fff; }

  .msg { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:.8rem .9rem; margin-bottom:.55rem; }
  .msg-head { display:flex; justify-content:space-between; align-items:center; gap:.5rem; font-size:.75rem; color:var(--ink-soft); font-weight:700; margin-bottom:.3rem; }
  .msg p { margin:0; white-space:pre-line; }
  .msg.fresh { border-color:var(--chasuble); }
  .msg.club { border-left:5px solid var(--gazon-deep); }

  .mot { background:var(--chasuble-tint); border-radius:14px; padding:.85rem .95rem; margin-bottom:.55rem; }
  .mot p { margin:0; font-weight:600; }
  .mot small { display:block; margin-top:.35rem; font-size:.75rem; color:var(--chasuble-ink); font-weight:700; }

  .post { background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden; margin-bottom:.8rem; }
  .post-img { width:100%; max-height:420px; object-fit:cover; background:var(--surface-2); }
  .post-body { padding:.75rem .9rem; }
  .post-head { display:flex; justify-content:space-between; align-items:center; gap:.5rem; font-size:.78rem; color:var(--ink-soft); font-weight:700; }
  .post-tag { font-weight:800; color:var(--ink); font-size:.85rem; }
  .post-body p { margin:.35rem 0 0; }
  .post-lieu { font-size:.8rem; color:var(--ink-soft); margin-top:.25rem; }
  .post-actions { display:flex; justify-content:space-between; align-items:center; margin-top:.55rem; }
  .like { border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:.3rem .7rem; font-size:.82rem; font-weight:800; cursor:pointer; }
  .like.on { border-color:var(--chasuble); background:var(--chasuble-tint); color:var(--chasuble-ink); }
  .photo-pick { display:flex; align-items:center; gap:.7rem; margin:.6rem 0; }
  .photo-pick label { display:inline-flex; align-items:center; gap:.4rem; border:1.5px dashed var(--line); border-radius:12px; padding:.6rem .9rem; font-weight:800; font-size:.85rem; cursor:pointer; }
  .photo-pick input { position:absolute; opacity:0; width:1px; height:1px; }
  .preview { width:72px; height:72px; object-fit:cover; border-radius:10px; }

  .session { display:flex; justify-content:space-between; align-items:center; gap:.5rem; background:var(--surface); border:1px solid var(--line); border-left:5px solid var(--gazon); border-radius:10px; padding:.6rem .8rem; margin-bottom:.45rem; font-size:.86rem; }
  .session.off { border-left-color:var(--line); }
  .session.match { border-left-color:var(--chasuble); }
  .session-date { font-weight:800; text-transform:capitalize; }

  .children { display:flex; gap:.45rem; flex-wrap:wrap; margin-top:.4rem; }
  .child { border:1.5px solid var(--line); background:var(--surface); border-radius:999px; padding:.45rem .95rem; font-weight:800; cursor:pointer; }
  .child.active { background:var(--gazon-deep); border-color:var(--gazon-deep); color:#fff; }

  .login { text-align:center; padding:1.4rem 1.1rem; }
  .login h3 { font-family:var(--display); font-size:1.6rem; margin:0 0 .3rem; }
  .login input { text-align:center; font-family:var(--display); font-size:1.6rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; margin-top:.8rem; }
  .error { color:var(--alert); font-weight:700; font-size:.85rem; margin-top:.6rem; }

  .wrapped-cta { display:flex; align-items:center; gap:.9rem; width:100%; text-align:left; border:none; cursor:pointer; border-radius:16px; padding:1rem; color:#fff;
    background:linear-gradient(135deg,var(--gazon-deep),#1F6E44 60%,var(--chasuble)); }
  .wrapped-cta b { font-family:var(--display); font-size:1.5rem; display:block; line-height:1; }
  .wrapped-cta span { font-size:.82rem; opacity:.9; }
  .wrapped-cta .star { font-size:2rem; }

  .bilan { white-space:pre-line; background:var(--surface-2); border-radius:10px; padding:.85rem; margin-top:.7rem; font-size:.88rem; }
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:.85rem; }
  th,td { text-align:left; padding:.5rem .4rem; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:.75rem; color:var(--ink-soft); }
  .code { font-family:var(--display); font-weight:800; font-size:1.05rem; white-space:nowrap; }
  .empty { border:1.5px dashed var(--line); border-radius:14px; padding:1.1rem; text-align:center; color:var(--ink-soft); font-size:.88rem; }

  /* Wrapped plein écran */
  .wrap-overlay { position:fixed; inset:0; z-index:50; color:#fff; display:flex; flex-direction:column;
    padding:calc(1rem + env(safe-area-inset-top,0px)) 1.3rem calc(1.3rem + env(safe-area-inset-bottom,0px));
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 52px,transparent 52px 104px),var(--gazon-deep); }
  .wrap-overlay.s1 { background-color:#123F28; } .wrap-overlay.s2 { background-color:#0F3E5E; }
  .wrap-overlay.s3 { background-color:#5A2A06; } .wrap-overlay.s4 { background-color:#2E2A5C; } .wrap-overlay.s5 { background-color:#123F28; }
  .wrap-bars { display:flex; gap:4px; }
  .wrap-bars i { flex:1; height:4px; border-radius:2px; background:rgba(255,255,255,.3); }
  .wrap-bars i.done { background:#fff; }
  .wrap-top { display:flex; justify-content:space-between; align-items:center; margin-top:.8rem; font-size:.85rem; opacity:.85; }
  .wrap-close { background:rgba(255,255,255,.15); border:none; color:#fff; border-radius:999px; width:34px; height:34px; font-size:1.1rem; cursor:pointer; }
  .wrap-stage { flex:1; display:flex; flex-direction:column; justify-content:center; max-width:520px; margin:0 auto; width:100%; }
  .wrap-kicker { font-size:1rem; opacity:.85; margin:0 0 .4rem; font-weight:700; }
  .wrap-big { font-family:var(--display); font-weight:800; font-size:clamp(4.5rem,24vw,8rem); line-height:.9; margin:0; }
  .wrap-title { font-family:var(--display); font-weight:800; font-size:clamp(2.2rem,10vw,3.4rem); line-height:.95; margin:0; }
  .wrap-text { font-size:1.1rem; margin:.8rem 0 0; opacity:.95; }
  .wrap-list { list-style:none; padding:0; margin:1rem 0 0; display:grid; gap:.45rem; }
  .wrap-list li { background:rgba(255,255,255,.12); border-radius:10px; padding:.55rem .8rem; font-weight:700; }
  .wrap-mvp { display:inline-block; margin-top:1rem; background:linear-gradient(135deg,var(--or-light),var(--or)); color:var(--or-ink); font-weight:800; border-radius:12px; padding:.6rem 1rem; font-size:1.1rem; }
  .wrap-photos { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:1rem; }
  .wrap-photos img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; }
  .wrap-nav { display:flex; gap:.6rem; }
  .wrap-nav button { flex:1; border:none; border-radius:12px; padding:.8rem; font-weight:800; cursor:pointer; background:rgba(255,255,255,.15); color:#fff; font-size:.95rem; }
  .wrap-nav button.next { background:#fff; color:var(--gazon-deep); }

  .match-item { display:flex; align-items:center; gap:.8rem; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-left:5px solid var(--chasuble); border-radius:14px; padding:.7rem .85rem; margin-bottom:.55rem; cursor:pointer; color:var(--ink); }
  .match-date { width:48px; flex-shrink:0; text-align:center; }
  .match-date b { display:block; font-family:var(--display); font-weight:800; font-size:1.8rem; line-height:1; }
  .match-date small { font-size:.72rem; color:var(--ink-soft); font-weight:700; }
  .match-info { flex:1; min-width:0; }
  .match-info strong { display:block; }
  .match-info small { color:var(--ink-soft); font-size:.8rem; display:block; }
  .pill { display:inline-block; font-size:.72rem; font-weight:800; border-radius:999px; padding:.15rem .55rem; }
  .pill.ok { background:var(--gazon-tint); color:var(--gazon); } .pill.ko { background:var(--alert-tint); color:var(--alert); } .pill.wait { background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line); }
  .photo-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .photo-grid img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; }
  .info-line { margin:.25rem 0; }
  .roster-list { display:flex; flex-wrap:wrap; gap:.4rem; }
  .roster-chip { display:inline-flex; align-items:center; gap:.35rem; border:1px solid var(--line); border-radius:999px; padding:.3rem .35rem .3rem .75rem; font-weight:700; font-size:.85rem; background:var(--surface-2); }
  .roster-chip button { border:none; background:var(--line); width:22px; height:22px; border-radius:50%; cursor:pointer; font-size:.72rem; line-height:1; }
  .import-btns { display:flex; flex-wrap:wrap; gap:.5rem; margin:.3rem 0 .8rem; }
  .import-btns label { position:relative; display:inline-flex; align-items:center; gap:.4rem; border:1.5px solid var(--line); border-radius:12px; padding:.65rem .9rem; font-weight:800; font-size:.88rem; cursor:pointer; background:var(--surface); }
  .import-btns input { position:absolute; opacity:0; width:1px; height:1px; }
  .busy { display:flex; align-items:center; gap:.5rem; font-weight:700; color:var(--gazon); margin:.4rem 0; }
  .segment button { white-space:normal; line-height:1.15; }

  .splash-pitch { position:absolute; inset:0; width:100%; height:100%; fill:none; stroke:rgba(255,255,255,.3); stroke-width:2; stroke-linecap:square; stroke-linejoin:miter; }
  .splash-pitch [pathLength] { stroke-dasharray:1 1; stroke-dashoffset:1; animation:sp-draw 1.6s ease-out forwards; }
  .splash-pitch .spot { fill:rgba(255,255,255,.3); stroke:none; }
  .sim-sep { flex:0 0 100%; height:0; } .sim-clock { flex-wrap:wrap; overflow:visible !important; }
  .splash-center { position:relative; text-align:center; padding:0 16px; }
  .splash-logo { background:none; border:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:.3rem; color:#fff; padding:1rem 1.2rem; border-radius:24px; transition:transform .2s; }
  .splash-logo:hover { transform:scale(1.03); } .splash-logo:focus-visible { outline:3px solid var(--or-light); outline-offset:4px; }
  .splash-ball { font-size:3.4rem; line-height:1; display:inline-block; animation:sp-roll 1.1s cubic-bezier(.2,.8,.3,1) both; }
  .splash-word { font-family:var(--display); font-weight:800; font-size:clamp(3.4rem, 18vw, 6rem); line-height:1; white-space:nowrap; }
  .splash-word i { font-style:normal; display:inline-block; opacity:0; transform:translateY(.45em); animation:sp-in .55s cubic-bezier(.2,.8,.3,1.25) forwards; } .splash-word i.o { color:#FF8A3D; }
  .splash-tag { margin:.5rem 0 0; opacity:0; animation:sp-fade .7s 1.35s forwards; font-weight:800; letter-spacing:.08em; text-transform:uppercase; font-size:.82rem; color:rgba(255,255,255,.9); }
  .splash-hint { margin:2.6rem 0 0; opacity:0; animation:sp-fade .6s 2s forwards, sp-pulse 2.2s 2.6s ease-in-out infinite; font-size:.88rem; color:rgba(255,255,255,.78); }
  .splash.out { animation:sp-out .42s ease forwards; }
  @keyframes sp-draw { to { stroke-dashoffset:0; } } @keyframes sp-roll { from { transform:translateX(-70vw) rotate(-720deg); } to { transform:none; } }

function codeFor(str) { let h = 7; for (const ch of str) h = (h * 31 + ch.codePointAt(0)) >>> 0; return h % 9000 + 1000; }
function families() {
  const list = [], used = {}, taken = {};

  SIBLINGS.forEach(g => {
    const kids = g.filter(c => players(c.catId).includes(c.name)); if (kids.length < 2) return;
    list.push({ code:mk(kids[0].name + '|' + kids[0].catId), children:kids }); kids.forEach(c => used[c.name + '|' + c.catId] = true);
  });

}

function renderTab() {

        (ctx.viewer.startsWith('club:') ? '' : `<button class="link-btn" style="margin-top:.4rem" data-act="fil-match" data-cat="${cid}" data-id="${esc(sid(s))}">Revoir la séance</button>`) + '</div>' });

    case 'star-pick': S.starDraft = S.starDraft && S.starDraft.name === p && S.starDraft.sid === d.sid ? null : { sid:d.sid, name:p, type:'', text:'', img:null }; break;
    case 'star-type': S.starDraft.type = d.id; break;
    case 'star-cancel': S.starDraft = null; break;
    case 'star-send': {
      const sd = S.starDraft, se = (S.data.sessions[catId] || []).find(x => sid(x) === sd.sid); if (!se) return;
      if (!sd.type) { toast('Choisis le type d\'étoile'); return; }
      se.stars = se.stars || []; if (se.stars.length >= 3) { toast('3 étoiles maximum par plateau'); return; }
      se.stars.push({ id:String(now().getTime()), name:sd.name, type:sd.type, text:(sd.text || '').trim(), img:sd.img, ts:now().toISOString(), by:edu(S.eduId).name });
      if (!save()) { se.stars.pop(); toast('Stockage plein, retire la photo et réessaie'); return; }
      toast('⭐ Étoile envoyée aux parents de ' + sd.name.split(' ')[0]); S.starDraft = null; break;
    }
    case 'star-del': { const se = (S.data.sessions[catId] || []).find(x => sid(x) === d.sid); if (!se) return; se.stars = (se.stars || []).filter(x => x.id !== d.id); save(); toast('Étoile retirée'); break; }
    case 'dictate': startDictation(d.target || 'star'); return;
    case 'story-open': {
      const se = sessions(d.cat).find(x => sid(x) === d.sid), st = se && (se.stars || []).find(x => x.id === d.id); if (!st) return;
      S.story = { cat:d.cat, sid:d.sid, id:d.id, img:null, name:st.name.split(' ')[0], fmt:'story', photo:null, text:storyCaption(se, st) }; storyRegen();
      return;
    }
    case 'story-fmt': if (S.story.fmt !== d.id) { S.story.fmt = d.id; storyRegen(); } return;
    case 'story-photo-del': S.story.photo = null; storyRegen(); return;
    case 'story-net': {
      const st = S.story, n = NETS.find(x => x.id === d.n); if (!st || !st.img || !n) return;
      try { navigator.clipboard.writeText(st.text).catch(() => {}); } catch (err) {}
      const file = new File([dataURLtoBlob(st.img)], 'etoile-' + st.name + '-' + st.fmt + '.png', { type:'image/png' });
      if (navigator.canShare && navigator.canShare({ files:[file] })) { navigator.share({ files:[file], text:st.text }).catch(() => {}); toast('Texte copié · choisis ' + (n.id === 'autre' ? 'l\'appli' : n.label) + ' dans le menu'); }
      else {
        if (DL) DL.save({ filename:file.name, data:dataURLtoBlob(st.img) }).catch(() => {});
        if (n.url) window.open(n.id === 'whatsapp' ? n.url + '?text=' + encodeURIComponent(st.text) : n.url, '_blank', 'noopener');
        toast('Texte copié' + (DL ? ' et image enregistrée' : '') + ' : ' + (n.id === 'whatsapp' ? 'ajoute l\'image dans WhatsApp' : 'colle le texte dans ' + n.label));
      }
      return;
    }
    case 'story-close': S.story = null; break;
    case 'story-share': {
      const file = new File([dataURLtoBlob(S.story.img)], 'etoile-' + S.story.name + '.png', { type:'image/png' });
      if (navigator.canShare && navigator.canShare({ files:[file] })) navigator.share({ files:[file], title:'Étoile du plateau' }).catch(() => {});
      else toast('Partage indisponible ici : fais un appui long sur l\'image');
      return;
    }
    case 'story-save': {
      if (!DL) return;
      DL.save({ filename:'etoile-' + S.story.name + '-' + S.story.fmt + '.png', data:dataURLtoBlob(S.story.img) }).then(() => toast('Image enregistrée')).catch(err => { if (err && err.code !== 'declined') toast('Enregistrement indisponible : appui long sur l\'image'); });
      return;
    }
    case 'match-back': S.openMatch = null; break;
    case 'roster-del': S.data.rosters[catId] = players(catId).filter(x => x !== p); S.draft = null; save(); toast(p + ' retiré de l\'effectif'); break;
    case 'roster-add-one': { const n = (S.newPlayer || '').trim(); if (!n) { toast('Écris un prénom'); return; } if (players(catId).includes(n)) { toast('Déjà dans l\'effectif'); return; }
      S.data.rosters[catId] = players(catId).concat(n); S.newPlayer = ''; S.draft = null; save(); toast(n + ' ajouté'); break; }
    case 'roster-replace': if (!applyRoster(catId, 'replace')) return; break;
    case 'roster-merge': if (!applyRoster(catId, 'merge')) return; break;
    case 'stype': markStart(); S.draft.type = d.id; S.draft.badges = {}; S.draft.stars = {}; S.draft.recap.themes = []; if (!S.draft.recap.edited) S.draft.recap.text = recapBuild(S.draft, edu(S.eduId).name); S.panel = null; break;
    case 'presence': markStart(); S.draft.presence[p] = !S.draft.presence[p]; break;
    case 'badge': {
      markStart(); const arr = S.draft.badges[p] || [], i = arr.indexOf(d.b);
      if (i !== -1) arr.splice(i, 1); else arr.push(d.b);
      S.draft.badges[p] = arr; break;
    }
    case 'vig': S.draft.vigilance[p] = !S.draft.vigilance[p]; break;
    case 'dstar': {
      markStart(); const st = S.draft.stars || (S.draft.stars = {}), cur = st[p];
      if (cur && cur.type === d.id) { delete st[p]; break; }
      st[p] = { type:d.id, text:(cur && cur.text) || '' }; toast(starType(d.id).ic + ' ' + starType(d.id).label + ' pour ' + p.split(' ')[0]); break;
    }
    case 'panel': if (d.kind !== 'perso') markStart(); S.panel = S.panel && S.panel.p === p && S.panel.kind === d.kind ? null : { p, kind:d.kind }; S.dict = null; break;
    case 'note-save': {
      const key = d.kind + '|' + p, txt = (S.noteDrafts[key] || '').trim();
      if (!txt) { toast('Écris quelque chose avant d\'enregistrer'); return; }
      const store = d.kind === 'parent' ? S.data.parentNotes : S.data.playerNotes, k = catId + '|' + p;
      (store[k] = store[k] || []).push({ date:todayISO(), ts:now().toISOString(), text:txt, author:edu(S.eduId).name });
      S.noteDrafts[key] = ''; save(); toast(d.kind === 'parent' ? 'Mot envoyé aux parents de ' + p : 'Note enregistrée'); break;
    }
    case 'save-obj': S.data.objectives[monthKey(catId)] = document.getElementById('obj').value.trim(); save(); toast('Objectif enregistré'); break;
    case 'save-session': {
      const dr = S.draft, nid = String(now().getTime()), e = edu(S.eduId), ts = now().toISOString();
      const elig = x => !mod('presences') || !!dr.presence[x];
      const text = (dr.recap.text || '').trim() || recapBuild(dr, e.name);
      const secs = dr.startedAt ? Math.min(900, Math.max(1, Math.round((Date.now() - dr.startedAt) / 1000))) : null;
      const badges = {}; Object.keys(dr.badges).forEach(x => { if (elig(x) && (dr.badges[x] || []).length) badges[x] = dr.badges[x].slice(); });
      const stars = isMatch(dr.type) ? Object.entries(dr.stars || {}).filter(([n, v]) => v && v.type && elig(n)).map(([n, v], k) => ({ id:nid + 's' + k, name:n, type:v.type, text:(v.text || '').trim(), img:null, ts, by:e.name })) : [];
      (S.data.sessions[catId] = S.data.sessions[catId] || []).push({ id:nid, date:dr.date, type:dr.type, presence:mod('presences') ? { ...dr.presence } : {}, badges, vigilance:{ ...dr.vigilance }, lieu:(dr.lieu || '').trim(), adv:(dr.adv || '').trim(), rdv:dr.rdv || '', teams:dr.teams || 1, team:dr.team || {}, stars, cr:'', recap:{ text, ts, by:e.name }, planId:dr.planId || null, fillSec:secs, by:e.name });
      if (dr.planId) { const pl = plans(catId).find(x => x.id === dr.planId); if (pl) pl.sessionId = nid; }
      let nm = 0;
      Object.entries(dr.mots || {}).forEach(([x, t]) => { t = (t || '').trim(); if (!t || !elig(x)) return; nm++; const k = catId + '|' + x; (S.data.parentNotes[k] = S.data.parentNotes[k] || []).push({ date:dr.date, ts, text:t, author:e.name, eventId:nid }); });
      if (!save()) { toast('Stockage du téléphone plein'); return; }
      const m = isMatch(dr.type);
      S.lastPublished = { catId, id:nid, secs, nm, nb:Object.values(badges).reduce((n, a) => n + a.length, 0), ns:stars.length, nfam:families().filter(f => f.children.some(k => k.catId === catId)).length, label:m ? (dr.type === 'plateau' ? 'Plateau' : 'Rencontre') : 'Entraînement', fem:dr.type === 'rencontre' };
      S.draft = null; S.fillOpen = false; S.panel = null; S.dict = null; window.scrollTo(0,0);
      toast('✅ Publié pour les parents' + (secs ? ' en ' + fmtSecs(secs) : ''));
      break;
    }
    case 'tpl': {
      const st = S[d.scope], tp = TEMPLATES[d.id]; st.tpl = d.id; st.fields = {};
      tp.fields.forEach(([k,,,def]) => { if (def) st.fields[k] = def; });
      st.text = tp.build(tplValues(tp, st.fields)); break;
    }
    case 'send-msg': {
      const m = (S.msg.text || '').trim(); if (!m) { toast('Le message est vide'); return; }
      pushMessage(catId, m, edu(S.eduId).name); S.msg = { text:'', tpl:null, fields:{} }; save(); toast('Message envoyé aux parents'); break;
    }
    case 'send-club': {
      const m = (S.clubMsg.text || '').trim(); if (!m) { toast('Le message est vide'); return; }
      const r = role(S.roleId), scope = r.cats || CATEGORIES.map(c => c.id), targets = S.clubMsg.target === 'all' ? scope : [S.clubMsg.target];
      targets.forEach(id => pushMessage(id, m, r.name, true)); S.clubMsg = { text:'', tpl:null, fields:{}, target:'all' }; save();
      toast('Envoyé à ' + targets.length + ' catégorie' + (targets.length > 1 ? 's' : '')); break;
    }
    case 'del-msg': S.data.messages[catId] = (S.data.messages[catId] || []).filter(x => x.id !== d.id); save(); toast('Message supprimé'); break;
    case 'post-tag': S.post.tag = d.id; break;
    case 'post-publish': {
      if (!S.post.img && !S.post.caption.trim()) { toast('Ajoute une photo ou une légende'); return; }
      const s = S.session, viewer = s.type === 'educ' ? 'edu:' + s.id : s.type === 'club' ? 'club:' + s.id : 'fam:' + s.id;
      const list = (S.data.posts[d.cat] = S.data.posts[d.cat] || []);
      list.push({ id:String(now().getTime()), ts:now().toISOString(), tag:S.post.tag, caption:S.post.caption.trim(), lieu:S.post.lieu.trim(), img:S.post.img, author:d.who, viewer, likes:{} });
      if (!save()) { list.pop(); toast('Stockage du téléphone plein, photo non publiée'); return; }
      S.post = { tag:'equipe', caption:'', lieu:'', img:null, cat:d.cat }; S.composeOpen = false; toast('Publié dans la communauté'); break;
    }
    case 'post-del': S.data.posts[d.cat] = (S.data.posts[d.cat] || []).filter(x => x.id !== d.id); save(); toast('Publication supprimée'); break;
    case 'like': { const po = (S.data.posts[d.cat] || []).find(x => x.id === d.id); if (!po) return; po.likes = po.likes || {}; po.likes[d.viewer] ? delete po.likes[d.viewer] : po.likes[d.viewer] = 1; save(); break; }
    case 'bilan': S.bilanFor = S.bilanFor === catId ? null : catId; break;
    case 'wrapped': S.wrapped = 0; break;
    case 'wrap-next': S.wrapped++; break;
    case 'wrap-prev': S.wrapped = Math.max(0, S.wrapped - 1); break;
    case 'wrap-close': S.wrapped = null; break;
    case 'copy': { const code = el.previousElementSibling.textContent; try { navigator.clipboard.writeText(code); } catch (err) {} toast('Code copié'); return; }
  }
  render();
});
document.addEventListener('keydown', e => { if (S.wrapped !== null && e.key === 'Escape') { S.wrapped = null; render(); } });

// Écran d'ouverture à chaque retour dans l'appli (appli ou onglet quitté puis rouvert)
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (hiddenAt && Date.now() - hiddenAt > 3000 && !S.splash && !(S.session && S.session.type === 'coach')) { S.splash = true; render(); }
});
window.addEventListener('pageshow', e => { if (e.persisted && !S.splash) { S.splash = true; render(); } });
window.addEventListener('resize', () => { const sp = document.querySelector('.splash-pitch'); if (S.splash && sp && !document.querySelector('.splash.out')) sp.outerHTML = splashPitch(); });
load();
// Une simulation enregistrée par une ancienne version est reconstruite (sinon les nouveautés n'apparaissent pas)
{ const hp = (location.hash.match(/plateau=(\d+)/) || [])[1]; if (hp) setTimeout(() => { const pp = pjByCode(hp); if (pp) { S.session = { type:'coach', id:pp.id, team:null }; S.pjWelcome = true; S.tab = null; render(); } }, 0); }
{ const im = location.hash.match(/invite=(\d+)&club=([^&]+)/); if (im) { S.splash = false; setTimeout(() => { const pp = pjByCode(im[1]); if (pp) { S.session = { type:'invite', id:pp.id, club:decodeURIComponent(im[2]) }; S.tab = null; render(); } }, 0); } }
{ const dm = location.hash.match(/direct=(\d+)(?:&equipe=(t\d+))?/); if (dm) { S.splash = false; setTimeout(() => { const pp = pjByCode(dm[1]); if (pp) { S.session = { type:'live', id:pp.id, team:dm[2] || null }; S.tab = null; render(); } }, 0); } }
if (/plateau=\d+/.test(location.hash)) S.splash = false;
if (S.data.simDate && (S.data.simVer || 0) < SIM_VER) { enterSim(true, ['v1','v2'].includes(S.data.club && S.data.club.version) ? S.data.club.version : 'v1'); setTimeout(() => toast('Simulation mise à jour avec les nouveautés'), 400); }
applySession();
render();
</script>
</body>
</html>
